<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none">
  <!-- アルカナ「魔術師」(I)。
       タロットの魔術師は「掲げた杖」と「無限大の記号」で描かれる。
       26px でも読めるように、杖と輪の2要素だけに絞った。
       輪を上に、杖を縦に通す——「掲げている」ことが形で伝わる。
       単色マスクとして使うので、白の塗りだけで組む。 -->

  <!-- 無限の輪。太い stroke で抜く。塗りつぶすと小さいとき潰れる -->
  <g stroke="white" stroke-width="9" fill="none" stroke-linecap="round">
    <path d="M 44 34
             C 32 34, 32 52, 44 52
             C 56 52, 72 34, 84 34
             C 96 34, 96 52, 84 52
             C 72 52, 56 34, 44 34 Z"/>
  </g>

  <!-- 杖。輪の下から真下へ通す -->
  <path fill="white"
    d="M 59 60 L 69 60 L 69 116 L 59 116 Z"/>

  <!-- 杖の先の光。小さな菱形を4方向に散らす -->
  <g fill="white">
    <path d="M 64 64 L 70 74 L 64 84 L 58 74 Z"/>
    <path d="M 30 92 L 36 86 L 42 92 L 36 98 Z"/>
    <path d="M 86 92 L 92 86 L 98 92 L 92 98 Z"/>
  </g>
</svg>
