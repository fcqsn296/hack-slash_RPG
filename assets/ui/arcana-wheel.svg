<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none">
  <!-- アルカナ「運命の輪」(X)。
       タロットの運命の輪は「回る大きな輪」で描かれる。
       26px でも読めるように、輪・軸・スポーク3本だけに絞った。
       スポークを3本にしたのは、物理・魔術・遺物の3つの系統を巡る札だから。
       単色マスクとして使うので、白の塗りだけで組む。 -->

  <!-- 輪。同心円の差（内の円は外の円の内側に収まるので evenodd で抜ける） -->
  <path fill="white" fill-rule="evenodd"
    d="M 64 8 A 56 56 0 1 0 64 120 A 56 56 0 1 0 64 8 Z
       M 64 20 A 44 44 0 1 1 64 108 A 44 44 0 1 1 64 20 Z"/>

  <!-- 軸 -->
  <path fill="white"
    d="M 64 52 A 12 12 0 1 0 64 76 A 12 12 0 1 0 64 52 Z"/>

  <!-- スポーク3本（上・右下・左下、120度ずつ） -->
  <path fill="white" d="M 60 22 L 68 22 L 68 54 L 60 54 Z"/>
  <path fill="white" transform="rotate(120 64 64)" d="M 60 22 L 68 22 L 68 54 L 60 54 Z"/>
  <path fill="white" transform="rotate(240 64 64)" d="M 60 22 L 68 22 L 68 54 L 60 54 Z"/>
</svg>
