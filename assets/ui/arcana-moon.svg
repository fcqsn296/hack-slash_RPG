<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none">
  <!-- アルカナ「月」(XVIII)。
       タロットの月は「水辺から見上げる月と、揺れる水面」で描かれる。
       26px でも読めるように、三日月と水面の揺れ2本だけに絞った。
       三日月＝まだ本物ではない傷、水面の揺れ＝誰かが触れて現実になる瞬間。
       単色マスクとして使うので、白の塗りだけで組む。 -->

  <!-- 三日月。外の円と内の円の交点を結ぶ2本の弧（evenodd だと内の円のはみ出しが塗られる） -->
  <path fill="white"
    d="M 67.2 8.7 A 40 40 0 1 0 95.8 65.8 A 32 32 0 1 1 67.2 8.7 Z"/>

  <!-- 水面の揺れ（上） -->
  <path fill="white"
    d="M 12 98 C 24 90 36 90 48 98 C 60 106 72 106 84 98 C 96 90 108 90 116 96
       L 116 104 C 108 98 96 98 84 106 C 72 114 60 114 48 106 C 36 98 24 98 12 106 Z"/>
  <!-- 水面の揺れ（下）。短くして奥行きを出す -->
  <path fill="white"
    d="M 28 116 C 38 110 48 110 58 116 C 68 122 78 122 88 116 C 94 112 100 112 104 114
       L 104 120 C 100 118 94 118 88 122 C 78 128 68 128 58 122 C 48 116 38 116 28 122 Z"/>
</svg>
