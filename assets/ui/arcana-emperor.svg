<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none">
  <!-- アルカナ「皇帝」(IV)。
       タロットの皇帝は「玉座」と「笏」で描かれる。
       26px でも読めるように、王冠と笏の2要素だけに絞った。
       剣ではなく笏にしてあるのは、自ら振るわない札だから。
       単色マスクとして使うので、白の塗りだけで組む。 -->

  <!-- 王冠。三つの山と台座。塗りつぶして輪郭で読ませる -->
  <path fill="white"
    d="M 26 56
       L 34 26 L 50 44 L 64 20 L 78 44 L 94 26 L 102 56 Z"/>
  <!-- 台座。冠の下を締める帯 -->
  <path fill="white"
    d="M 26 62 L 102 62 L 102 74 L 26 74 Z"/>

  <!-- 笏。冠の下から真下へ。細く長く -->
  <path fill="white"
    d="M 58 80 L 70 80 L 70 118 L 58 118 Z"/>

  <!-- 笏を握る横木。王が持っていることを示す -->
  <path fill="white"
    d="M 40 92 L 88 92 L 88 102 L 40 102 Z"/>
</svg>
