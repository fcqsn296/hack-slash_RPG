<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none">
  <!-- アルカナ「力」(VIII)。
       上のレムニスケート（∞）はタロットの「力」に描かれる無限の徴。
       下は獣の爪痕。26px でも読めるように、細部より太さを優先している。
       単色マスクとして使うので、白の塗りだけで組む（線は path で太らせる）。 -->

  <!-- ∞ ─ 左右の輪。stroke ではなく塗りで抜くと小さい時に潰れるので、
       太い stroke をそのまま使う（mask 化しても太さが残る） -->
  <g stroke="white" stroke-width="11" stroke-linecap="round" fill="none">
    <path d="M 64 36
             C 56 24 40 24 33 33
             C 26 42 28 54 38 58
             C 48 62 58 52 64 36 Z"/>
    <path d="M 64 36
             C 72 24 88 24 95 33
             C 102 42 100 54 90 58
             C 80 62 70 52 64 36 Z"/>
  </g>

  <!-- 爪痕 3本。上が太く下が細い＝振り下ろした向きが伝わる -->
  <path fill="white"
    d="M 36 74 C 44 88 50 102 54 116 L 45 116 C 41 102 36 88 29 76 Z"/>
  <path fill="white"
    d="M 64 72 C 70 88 73 102 75 118 L 66 118 C 64 102 61 88 56 74 Z"/>
  <path fill="white"
    d="M 92 74 C 92 88 90 102 86 116 L 77 116 C 82 102 85 88 85 76 Z"/>
</svg>
