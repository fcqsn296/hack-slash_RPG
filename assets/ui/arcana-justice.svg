<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none">
  <!-- アルカナ「正義」(XI)。
       タロットの正義は「剣と天秤を携える者」で描かれる。
       26px でも読めるように、剣を軸に立て、その鍔を天秤の竿にした。
       剣＝裁き、天秤＝量る——「先に量ってから振り下ろす」が1つの形に収まる。
       単色マスクとして使うので、白の塗りだけで組む。 -->

  <!-- 剣身。上へ向けて立てる -->
  <path fill="white"
    d="M 64 8 L 70 20 L 70 92 L 58 92 L 58 20 Z"/>
  <!-- 柄と柄頭 -->
  <path fill="white"
    d="M 60 92 L 68 92 L 68 110 L 60 110 Z"/>
  <path fill="white"
    d="M 56 110 L 72 110 L 72 120 L 56 120 Z"/>

  <!-- 天秤の竿。剣の鍔を兼ねる -->
  <path fill="white"
    d="M 16 38 L 112 38 L 112 46 L 16 46 Z"/>

  <!-- 左の皿を吊る紐と皿 -->
  <path fill="white"
    d="M 20 46 L 24 46 L 14 74 L 10 74 Z"/>
  <path fill="white"
    d="M 28 46 L 32 46 L 42 74 L 38 74 Z"/>
  <path fill="white"
    d="M 6 74 L 46 74 C 44 86 36 92 26 92 C 16 92 8 86 6 74 Z"/>

  <!-- 右の皿を吊る紐と皿 -->
  <path fill="white"
    d="M 96 46 L 100 46 L 90 74 L 86 74 Z"/>
  <path fill="white"
    d="M 104 46 L 108 46 L 118 74 L 114 74 Z"/>
  <path fill="white"
    d="M 82 74 L 122 74 C 120 86 112 92 102 92 C 92 92 84 86 82 74 Z"/>
</svg>
