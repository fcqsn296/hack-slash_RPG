<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none">
  <!-- アルカナ「女帝」(III)。
       タロットの女帝は「実った麦の中に座す冠の女性」で描かれる。
       26px でも読めるように、冠と、三方へ分かれる麦の穂だけに絞った。
       穂が三方へ分かれるのは、自分の実りを周りへ分ける札だから。
       単色マスクとして使うので、白の塗りだけで組む。 -->

  <!-- 冠 -->
  <path fill="white"
    d="M 34 34 L 44 12 L 54 28 L 64 8 L 74 28 L 84 12 L 94 34 Z"/>
  <path fill="white" d="M 34 38 L 94 38 L 94 46 L 34 46 Z"/>

  <!-- 茎（中央）と穂 -->
  <path fill="white" d="M 60 56 L 68 56 L 68 122 L 60 122 Z"/>
  <path fill="white" d="M 64 52 C 72 60 72 72 64 80 C 56 72 56 60 64 52 Z"/>
  <!-- 左へ分かれる茎と穂 -->
  <path fill="white" d="M 60 104 L 64 110 L 38 84 L 42 78 Z"/>
  <path fill="white" d="M 30 66 C 42 66 48 76 44 86 C 32 84 26 76 30 66 Z"/>
  <!-- 右へ分かれる茎と穂 -->
  <path fill="white" d="M 68 104 L 64 110 L 90 84 L 86 78 Z"/>
  <path fill="white" d="M 98 66 C 86 66 80 76 84 86 C 96 84 102 76 98 66 Z"/>
</svg>
