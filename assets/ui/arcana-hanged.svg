<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none">
  <!-- アルカナ「吊るされた男」(XII)。
       タロットの札では、T字の枝から片足で逆さに吊られ、
       もう片足を膝で組んで「4」の形を作る。あの形はごく小さくても読めるので、
       頭を下・組んだ脚を上にした輪郭をそのまま使う。
       単色マスクなので白の塗りと太い stroke だけで組む。 -->

  <!-- T字の枝 -->
  <rect x="14" y="10" width="100" height="11" rx="5" fill="white"/>
  <!-- 吊る縄。枝から右足首へ -->
  <rect x="74" y="21" width="9" height="20" rx="4" fill="white"/>

  <g stroke="white" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- 吊られている脚（まっすぐ上へ）と胴 -->
    <path d="M 78 40 L 64 66"/>
    <!-- 組んだ脚。膝で曲げて「4」を作る部分 -->
    <path d="M 78 44 L 44 56 L 62 74"/>
  </g>

  <!-- 頭は下。輪は「逆さでも保たれる静けさ」の徴 -->
  <circle cx="60" cy="96" r="17" fill="white"/>
  <!-- 光輪 -->
  <g stroke="white" stroke-width="6" fill="none" opacity="0.9">
    <circle cx="60" cy="96" r="27"/>
  </g>
</svg>
