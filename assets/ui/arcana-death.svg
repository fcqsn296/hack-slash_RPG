<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none">
  <!-- アルカナ「死」(XIII)。
       タロットの死神は「骸骨の刈り手」で描かれる。
       26px でも読めるように、鎌の輪郭ひとつに絞った。
       刃を大きく、柄を細く——小さくしても「鎌」だと分かるのは刃の曲線のほう。
       単色マスクとして使うので、白の塗りだけで組む。 -->

  <!-- 刃。内側を抜いた三日月で、厚みのある弧にする -->
  <path fill="white"
    d="M 18 30
       C 46 20, 82 28, 104 52
       C 84 40, 52 36, 30 44
       C 46 46, 66 50, 80 60
       C 58 54, 32 52, 18 30 Z"/>

  <!-- 柄。刃の根元から斜めに下ろす -->
  <path fill="white"
    d="M 92 44 L 102 50 L 66 112 L 56 106 Z"/>

  <!-- 石突き。柄の先を留める短い横木 -->
  <path fill="white"
    d="M 50 100 L 74 114 L 69 122 L 45 108 Z"/>
</svg>
