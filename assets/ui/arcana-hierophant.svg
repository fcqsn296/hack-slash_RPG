<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none">
  <!-- アルカナ「教皇」(V)。
       タロットの教皇は「三重の横木を持つ杖を掲げる祭司」で描かれる。
       26px でも読めるように、三重十字と台座だけに絞った。
       横木を下ほど長くして、一つの式が広がって皆へ届く形に見せる。
       単色マスクとして使うので、白の塗りだけで組む。 -->

  <!-- 縦の軸 -->
  <path fill="white" d="M 58 8 L 70 8 L 70 104 L 58 104 Z"/>
  <!-- 横木3本（上から短→長） -->
  <path fill="white" d="M 46 20 L 82 20 L 82 30 L 46 30 Z"/>
  <path fill="white" d="M 36 40 L 92 40 L 92 50 L 36 50 Z"/>
  <path fill="white" d="M 26 60 L 102 60 L 102 70 L 26 70 Z"/>
  <!-- 台座 -->
  <path fill="white" d="M 38 104 L 90 104 L 98 120 L 30 120 Z"/>
</svg>
