<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none">
  <!-- アルカナ「節制」(XIV)。
       タロットの節制は「二つの杯を注ぎ分ける天使」で描かれる。
       26px でも読めるように、杯2つと注ぐ流れだけに絞った。
       杯を上下にずらし、斜めの流れで繋ぐ——「移し替えている」ことが形で伝わる。
       単色マスクとして使うので、白の塗りだけで組む。 -->

  <!-- 上の杯。傾けて注いでいる -->
  <path fill="white"
    d="M 20 26 L 60 26 L 52 50 L 28 50 Z"/>
  <!-- 上の杯の脚 -->
  <path fill="white"
    d="M 34 50 L 46 50 L 46 60 L 34 60 Z"/>
  <path fill="white"
    d="M 26 60 L 54 60 L 54 68 L 26 68 Z"/>

  <!-- 注ぐ流れ。上の杯の縁から下の杯へ、斜めに一本 -->
  <path fill="white"
    d="M 56 32 L 66 36 L 84 74 L 74 78 Z"/>

  <!-- 下の杯。受けている -->
  <path fill="white"
    d="M 68 76 L 108 76 L 100 100 L 76 100 Z"/>
  <path fill="white"
    d="M 82 100 L 94 100 L 94 110 L 82 110 Z"/>
  <path fill="white"
    d="M 74 110 L 102 110 L 102 118 L 74 118 Z"/>
</svg>
