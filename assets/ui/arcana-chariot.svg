<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none">
  <!-- アルカナ「戦車」(VII)。
       タロットの戦車は「天蓋のある車体」と「二頭の獣」で描かれる。
       26px でも読めるように、車輪と天蓋の2要素だけに絞った。
       速さは輪郭でなく**後ろへ流れる線**で出す（止まらない、という像）。
       単色マスクとして使うので、白の塗りだけで組む。 -->

  <!-- 天蓋。星を戴く布ではなく、輪郭だけを台形で -->
  <path fill="white"
    d="M 44 26 L 92 26 L 100 44 L 36 44 Z"/>

  <!-- 車体。天蓋の下に据える箱 -->
  <path fill="white"
    d="M 40 50 L 104 50 L 104 78 L 40 78 Z"/>

  <!-- 車輪。塗りつぶすと潰れるので、太い stroke の輪で抜く -->
  <g stroke="white" stroke-width="9" fill="none">
    <circle cx="58" cy="94" r="16"/>
    <circle cx="98" cy="94" r="16"/>
  </g>

  <!-- 後ろへ流れる線 3本。上が長く下が短い＝進んでいる向きが伝わる。
       車体の左側に置いて、右へ駆けていることを示す -->
  <g stroke="white" stroke-width="8" stroke-linecap="round">
    <path d="M 8 56 L 32 56"/>
    <path d="M 14 70 L 32 70"/>
    <path d="M 20 84 L 32 84"/>
  </g>
</svg>
