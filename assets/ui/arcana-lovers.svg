<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none">
  <!-- アルカナ「恋人」(VI)。
       タロットの恋人は「向き合う二人」で描かれる。
       26px でも読めるように、重なった二つの輪だけに絞った。
       重なり＝分かち合い。輪をずらして置くことで「二人」だと分かる。
       単色マスクとして使うので、白の塗りだけで組む。 -->

  <!-- 二つの輪。太い stroke で抜く。塗ると小さいとき潰れる -->
  <g stroke="white" stroke-width="10" fill="none">
    <circle cx="48" cy="56" r="26"/>
    <circle cx="80" cy="56" r="26"/>
  </g>

  <!-- 重なった部分を塗って「分かち合っている」ことを示す。
       輪と輪の交わりを、レンズ形で埋める -->
  <path fill="white"
    d="M 64 34
       C 72 41, 72 71, 64 78
       C 56 71, 56 41, 64 34 Z"/>

  <!-- 結び目。二つの輪を下で束ねる短い帯 -->
  <path fill="white"
    d="M 50 94 L 78 94 L 78 106 L 50 106 Z"/>
</svg>
